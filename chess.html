<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savage Chess</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
      :root {
    --bg-body: #0c0c0f;
    --bg-panel: #1a1a1e;
    --bg-card: #131317;
    --bg-eval: #1e1e24;
    --text-primary: #e8e8e8;
    --text-secondary: #a0a0a8;
    --text-muted: #6b6b76;
    --accent: #6b9f3a;
    --accent-hover: #7fb64a;
    --danger: #c54b4b;
    --eval-light: #dadada;
    --eval-dark: #2a2a30;
    --highlight-move: rgba(120, 180, 40, 0.25);
    --highlight-select: rgba(120, 180, 40, 0.45);
    --border-subtle: #2c2c33;
    --modal-overlay: rgba(8, 8, 12, 0.92);
}

body {
    background: var(--bg-body);
    color: var(--text-secondary);
    font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 30px 15px;
    box-sizing: border-box;
    font-weight: 400;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
}

.game-layout {
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 1100px;
    width: 100%;
}

/* Eval bar – cleaner, no outer shadows */
.board-eval-wrap {
    display: flex;
    flex-direction: row;
    gap: 16px;
    width: min(100%, 560px);
    justify-content: center;
}

.eval-container {
    width: 28px;
    flex-shrink: 0;
    background: var(--eval-dark);
    border-radius: 6px;
    position: relative;
    overflow: hidden;
    border: 1px solid var(--border-subtle);
}

#evalBar {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 50%;
    background: linear-gradient(0deg, #e0e0e0, #f5f5f5);
    transition: height 0.35s cubic-bezier(0.2, 0.9, 0.3, 1);
    box-shadow: none;
}

.board-wrapper {
    flex-grow: 1;
    border-radius: 8px;
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.7);
    background: #1d1d23;
    border: 1px solid #2b2b33;
}

#myBoard {
    width: 100%;
    border-radius: 8px;
    overflow: hidden;
}

/* legal move hints – exactly as before (no changes) */
.highlight-last-move {
    box-shadow: inset 0 0 0 100px var(--highlight-move) !important;
}
.highlight-selected {
    box-shadow: inset 0 0 0 100px var(--highlight-select) !important;
}
.highlight-hint::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 28%; height: 28%;
    background: rgba(0, 0, 0, 0.25);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
}
.highlight-capture::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 82%; height: 82%;
    background: transparent;
    border: 4px solid rgba(0, 0, 0, 0.25);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    box-sizing: border-box;
}
.check-square {
    box-shadow: inset 0 0 0 3px rgba(220, 70, 70, 0.7) !important;
}

/* Side panel – modern card with subtle border */
.side-panel {
    width: 300px;
    background: var(--bg-panel);
    padding: 24px 22px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    border: 1px solid #2e2e36;
}

.status-card {
    background: var(--bg-card);
    padding: 16px;
    border-left: 4px solid var(--accent);
    font-weight: 500;
    color: var(--text-primary);
    border-radius: 8px;
    font-size: 1.05rem;
    min-height: 80px;
    line-height: 1.5;
    border: 1px solid var(--border-subtle);
}

.engine-stats {
    font-family: 'JetBrains Mono', 'Consolas', 'Menlo', monospace;
    background: var(--bg-card);
    padding: 16px;
    border-radius: 8px;
    color: #b5d6a0;
    font-size: 0.95rem;
    border: 1px solid var(--border-subtle);
    line-height: 1.6;
}

#engineThinking {
    color: #cfb87c;
    font-size: 0.8rem;
    margin-top: 8px;
    font-style: italic;
}

#pgnArea {
    height: 150px;
    background: var(--bg-card);
    padding: 14px;
    font-family: 'JetBrains Mono', 'Consolas', 'Menlo', monospace;
    font-size: 0.85rem;
    overflow-y: auto;
    border-radius: 8px;
    color: var(--text-secondary);
    border: 1px solid var(--border-subtle);
    line-height: 1.6;
    resize: none;
    scrollbar-width: thin;
    scrollbar-color: #444 #1a1a1e;
}

/* Buttons – cleaner, no shadows */
.controls {
    display: flex;
    gap: 12px;
}
.btn {
    flex: 1;
    padding: 12px 10px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 500;
    transition: background 0.2s, color 0.2s, transform 0.1s;
    background: #2d2d35;
    color: var(--text-secondary);
    font-size: 0.95rem;
    border: 1px solid #3a3a44;
}
.btn:hover {
    background: #3e3e48;
    color: var(--text-primary);
    border-color: #4f4f5c;
    transform: translateY(-1px);
}
.btn:active {
    transform: translateY(0);
}
.btn-green {
    background: var(--accent);
    color: #ffffff;
    border-color: #5d8c32;
}
.btn-green:hover {
    background: var(--accent-hover);
    border-color: #6fa53f;
}
.btn-reset:hover {
    background: var(--danger);
    border-color: #b33b3b;
    color: #fff;
}
.btn-white {
    background: #f0f0f3;
    color: #1a1a1e;
    border-color: #c0c0cc;
}
.btn-white:hover {
    background: #ffffff;
    color: #000;
}

/* Modals – crisp and minimal */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: var(--modal-overlay);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    backdrop-filter: blur(6px);
}

.modal-box {
    background: var(--bg-panel);
    padding: 36px 48px;
    border-radius: 16px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
    border: 1px solid #3a3a46;
}

.modal-box h2 {
    margin-top: 0;
    color: var(--text-primary);
    font-weight: 500;
    font-size: 1.6rem;
    letter-spacing: -0.01em;
}

#promotionDialog {
    display: none;
}
.promo-pieces {
    display: flex;
    gap: 20px;
    justify-content: center;
    margin-top: 30px;
}
.promo-piece {
    width: 70px;
    height: 70px;
    cursor: pointer;
    background: #2a2a32;
    border-radius: 12px;
    transition: background 0.2s, transform 0.15s;
    padding: 6px;
    border: 1px solid #40404c;
}
.promo-piece:hover {
    background: var(--accent);
    transform: translateY(-4px);
    border-color: #6f9f3a;
}

/* PGN color badges – subtle and clean */
.pgn-move {
    padding: 2px 8px;
    border-radius: 20px;
    display: inline-block;
    margin-right: 6px;
    font-size: 0.8rem;
    font-weight: 500;
}
.pgn-best { background: #2a5e2a; color: #fff; }
.pgn-close { background: #3f7840; color: #fff; }
.pgn-inacc { background: #c7a43b; color: #0c0c0f; }
.pgn-mist { background: #d97c2b; color: #fff; }
.pgn-blund { background: #ff4545; color: #fff; }

/* scrollbar styling */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: #19191f; border-radius: 6px; }
::-webkit-scrollbar-thumb { background: #40404b; border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: #5a5a68; }

/* additional refinements */
#curDepth, #evalScore {
    color: var(--text-primary);
    font-weight: 500;
}
#evalScore {
    color: #b5d6a0;
}
    </style>
</head>
<body>

<div id="gameModal" class="modal-overlay">
    <div class="modal-box">
        <h2>Choose Your Side</h2>
        <p style="color: #888; margin-bottom: 25px; font-size: 0.9rem;">Engine Depth: 11-25</p>
        <div style="display: flex; gap: 15px; justify-content: center;">
            <button id="playWhiteBtn" class="btn btn-white" onclick="startGame('w')">White</button>
            <button class="btn" onclick="startGame('b')">Black</button>
        </div>
    </div>
</div>

<div id="promotionDialog" class="modal-overlay">
    <div class="modal-box">
        <h2>Promote Pawn</h2>
        <div class="promo-pieces" id="promoPiecesContainer"></div>
    </div>
</div>

<div class="game-layout">
    <div class="board-eval-wrap">
        <div class="eval-container">
            <div id="evalBar"></div>
        </div>
        <div class="board-wrapper">
            <div id="myBoard"></div>
        </div>
    </div>

    <div class="side-panel">
        <div class="status-card" id="status">Engine ready. Choose side to start.</div>
        
        <div class="engine-stats">
            <div style="display: flex; justify-content: space-between;">
                <span>Depth: <span id="curDepth" style="color:#fff">0</span></span>
                <span>Eval: <strong id="evalScore" style="color:#fff">0.00</strong></span>
            </div>
            <div id="engineThinking" style="display:none;">Engine is analyzing...</div>
        </div>

        <div id="pgnArea"></div>

        <div class="controls">
            <button class="btn" onclick="copyPGN(event)">Copy PGN</button>
            <button class="btn btn-reset" onclick="location.reload()">Resign</button>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

function escapeHtml(str) {
  if (typeof str !== 'string') return String(str || '');
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function setStatus(htmlContent) {
  try {
    const $el = $('#status');
    const wrap = document.createElement('span');
    wrap.className = 'bot-msg enter';
    wrap.innerHTML = htmlContent;
    $el.html('');
    $el.append(wrap);
    requestAnimationFrame(() => {
      wrap.classList.remove('enter');
      wrap.classList.add('visible', 'bot-glow');
      setTimeout(() => wrap.classList.remove('bot-glow'), 1600);
    });
  } catch (e) {
    $('#status').text($(htmlContent).text ? $(htmlContent).text() : htmlContent);
  }
}

function setEngineStatus(text) { $('#engineThinking').html(text).show(); }
function clearEngineStatus() { $('#engineThinking').hide(); }

function handleOnlineChange() {
  if (isOnline()) {
    $('#networkStatus').text('Online').removeClass('offline').addClass('online');
    if (!stockfish) initStockfish();
  } else {
    $('#networkStatus').text('Offline').removeClass('online').addClass('offline');
    setEngineStatus('⚠️ Offline mode: cloud & lichess disabled.');
  }
}
if (typeof window !== 'undefined') {
  window.addEventListener('online', handleOnlineChange);
  window.addEventListener('offline', handleOnlineChange);
  $(document).ready(handleOnlineChange);
}

function initStockfish() {
  if (stockfish) return;
  try {
    if (typeof Stockfish !== 'undefined' && typeof Stockfish === 'function') {
      stockfish = Stockfish();
      attachStockfishHandlers(stockfish);
      applyEngineSettings();
      console.log('Using preloaded Stockfish factory.');
      return;
    }
    if (!isOnline()) {
      console.warn('Offline: skipping CDN Stockfish initialization.');
      stockfish = null;
      return;
    }
    const blob = new Blob([`importScripts('${ENGINE_CONFIG.STOCKFISH_CDN}');`], { type: 'application/javascript' });
    stockfish = new Worker(URL.createObjectURL(blob));
    attachStockfishHandlers(stockfish);
    applyEngineSettings();
    console.log(`Stockfish initialized from CDN with ${ENGINE_CONFIG.THREADS} threads & ${ENGINE_CONFIG.HASH_MB}MB.`);
  } catch (err) {
    console.error('Stockfish init failed:', err);
    stockfish = null;
    setStatus('Local engine unavailable — will use simple fallback if needed.');
  }
}

function attachStockfishHandlers(sf) {
  sf.onmessage = (e) => handleStockfishMessage(e);
}

function applyEngineSettings() {
  if (!stockfish) return;
  try {
    stockfish.postMessage('uci');
    stockfish.postMessage('isready');
    stockfish.postMessage(`setoption name Threads value ${ENGINE_CONFIG.THREADS}`);
    stockfish.postMessage(`setoption name Hash value ${ENGINE_CONFIG.HASH_MB}`);
    stockfish.postMessage('ucinewgame');
    stockfish.postMessage('position startpos');
    preAnalysisResult = null;
    currentSFDepth = 0;
    $('#curDepth').text('0/Adp');
  } catch (err) {
    console.warn('applyEngineSettings failed:', err);
  }
}

function handleStockfishMessage(e) {
  const raw = e && e.data;
  const line = (typeof raw === 'string') ? raw.trim()
    : (raw && raw.type === 'stdout' && raw.data ? String(raw.data).trim() : '');
  if (!line) return;

  const dm = line.match(/\bdepth\s+(\d+)\b/);
  if (dm) {
    currentSFDepth = parseInt(dm[1], 10);
    $('#curDepth').text(`${currentSFDepth}/Adp`);
  }

  // Intercept multipv
  const pvMatch = line.match(/ pv ([a-h][1-8][a-h][1-8][qrbn]?)/);
  if (pvMatch) localMultiPvMoves.add(pvMatch[1]);

  if (line.startsWith('info')) {
    const cp = line.match(/\bscore cp (-?\d+)\b/);
    const mate = line.match(/\bscore mate (-?\d+)\b/);
    if (preAnalysisResult && preAnalysisResult.waitingFor === 'pre') {
      if (cp) preAnalysisResult.info = { type: 'cp', value: parseInt(cp[1], 10) };
      else if (mate) preAnalysisResult.info = { type: 'mate', value: parseInt(mate[1], 10) };
    }
    return;
  }
  if (line.startsWith('bestmove')) {
    const bm = line.match(/bestmove\s+([a-h][1-8][a-h][1-8][qrbn]?)/);
    const best = bm ? bm[1] : null;
    
    if (preAnalysisResult && preAnalysisResult.waitingFor === 'pre') {
      preAnalysisResult.bestmove = best;
      preAnalysisResult.waitingFor = null;
    }

    if (stockfish && stockfish._multiPvResolver) {
        const resolver = stockfish._multiPvResolver;
        stockfish._multiPvResolver = null;
        const movesArray = Array.from(localMultiPvMoves);
        localMultiPvMoves.clear();
        try { resolver(movesArray.length ? movesArray : (best ? [best] :[])); } catch (e) {}
    }
    else if (stockfish && stockfish._localResolver) {
      const resolver = stockfish._localResolver;
      stockfish._localResolver = null;
      const info = (preAnalysisResult && preAnalysisResult.info) ? preAnalysisResult.info : null;
      try { resolver({ move: best, info }); } catch (e) { console.warn('resolver error', e); }
    }
  }
}

function getLocalBestMove(fen, depth = ENGINE_CONFIG.LOCAL_FALLBACK_DEPTH, timeoutMs = ENGINE_CONFIG.LOCAL_ENGINE_TIMEOUT_MS) {
  return new Promise((resolve, reject) => {
    if (!stockfish) return reject(new Error('Local Stockfish unavailable'));
    try {
      if (stockfish._localResolver) {
        try { stockfish._localResolver(null); } catch (e) {}
        stockfish._localResolver = null;
      }
      stockfish.postMessage('stop');
      stockfish.postMessage('ucinewgame');
      stockfish.postMessage(`position fen ${fen}`);
      stockfish._localResolver = (result) => {
        clearTimeout(timeoutId);
        if (!result || !result.move) return reject(new Error('Local engine returned no move'));
        resolve(result);
      };
      stockfish.postMessage(`go depth ${depth}`);
      const timeoutId = setTimeout(() => {
        if (stockfish && stockfish._localResolver) {
          stockfish._localResolver = null;
          reject(new Error('Local Engine timeout'));
        }
      }, timeoutMs);
    } catch (err) {
      if (stockfish && stockfish._localResolver) stockfish._localResolver = null;
      reject(err);
    }
  });
}

function fetchWithTimeout(resource, options = {}, timeout = ENGINE_CONFIG.FETCH_TIMEOUT_MS) {
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error('Fetch timeout')), timeout);
    fetch(resource, options).then(res => {
      clearTimeout(timer);
      resolve(res);
    }).catch(err => {
      clearTimeout(timer);
      reject(err);
    });
  });
}

async function executeCloudWithRetry(fen, depth, retries) {
  if (!isOnline()) throw new Error('Offline — cloud API skipped');
  if (typeof fen !== 'string' || fen.split(/\s+/).length !== 6) throw new Error('Invalid FEN');
  for (let attempt = 1; attempt <= retries; attempt++) {
    try {
      const body = JSON.stringify({ fen, depth });
      const resp = await fetchWithTimeout(ENGINE_CONFIG.CLOUD_API_URL, {
        method: 'POST', headers: {'Content-Type': 'application/json'}, body
      }, ENGINE_CONFIG.FETCH_TIMEOUT_MS);
      if (!resp.ok) throw new Error(`Cloud HTTP ${resp.status}`);
      const data = await resp.json();
      if (!data || (!data.move && !data.bestmove && !data.mv)) throw new Error('Malformed cloud response');
      return data;
    } catch (err) {
      console.warn(`Cloud attempt ${attempt} failed:`, err.message);
      if (attempt === retries) throw err;
      await sleep(700 * attempt);
    }
  }
}

async function executeLichessEval(fen, multiPv = 3) {
  if (!isOnline()) throw new Error('Offline — lichess skipped');
  const url = `${ENGINE_CONFIG.LICHESS_API_URL}?fen=${encodeURIComponent(fen)}&multiPv=${multiPv}&variant=standard`;
  for (let attempt = 1; attempt <= ENGINE_CONFIG.LICHESS_MAX_RETRIES; attempt++) {
    try {
      const r = await fetchWithTimeout(url, { headers: { Accept: 'application/json' } }, ENGINE_CONFIG.FETCH_TIMEOUT_MS);
      if (!r.ok) throw new Error(`Lichess HTTP ${r.status}`);
      const data = await r.json();
      if (!data || !data.pvs || !data.pvs.length) throw new Error('No PVS from Lichess');
      return data;
    } catch (err) {
      console.warn(`Lichess attempt ${attempt} failed: ${err.message}`);
      if (attempt === ENGINE_CONFIG.LICHESS_MAX_RETRIES) throw err;
      await sleep(600 * attempt);
    }
  }
}

async function getLichessRandomMove(fen, topN = 6) {
  try {
    const data = await executeLichessEval(fen, topN);
    const moves = data.pvs.map(pv => pv.moves.split(' ')[0]).filter(Boolean);
    if (!moves.length) return null;
    const limited = moves.slice(0, topN);
    return limited[Math.floor(Math.random() * limited.length)];
  } catch (err) {
    console.warn('Lichess fallback failed:', err.message);
    return null;
  }
}

// First Move Fetcher combining Lichess, SF 18, and SF 11 Top Moves
async function getFirstMove(fen) {
    let possibleMoves = new Set();
    let promises =[];

    // 1. Lichess (Top 5)
    if (isOnline()) {
        promises.push((async () => {
            try {
                const data = await executeLichessEval(fen, 5);
                if (data && data.pvs) data.pvs.forEach(pv => possibleMoves.add(pv.moves.split(' ')[0]));
            } catch(e) {}
        })());
    }

    // 2. Cloud SF 18 (Top 5)
    if (isOnline()) {
        promises.push((async () => {
            try {
                const body = JSON.stringify({ fen, depth: 10, multipv: 5 });
                const resp = await fetchWithTimeout(ENGINE_CONFIG.CLOUD_API_URL, {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, body
                }, 5000);
                const data = await resp.json();
                if (data && data.move) possibleMoves.add(data.move);
                if (data && data.pvs) data.pvs.forEach(pv => possibleMoves.add(pv.moves.split(' ')[0]));
            } catch(e) {}
        })());
    }

    // 3. Local SF 11 (Top 5)
    if (stockfish) {
        promises.push((async () => {
            try {
                let localMoves = await new Promise((resolve) => {
                    localMultiPvMoves.clear();
                    stockfish._multiPvResolver = resolve;
                    stockfish.postMessage('stop');
                    stockfish.postMessage('ucinewgame');
                    stockfish.postMessage('setoption name MultiPV value 5');
                    stockfish.postMessage(`position fen ${fen}`);
                    stockfish.postMessage(`go depth 10`);
                    setTimeout(() => {
                        if (stockfish && stockfish._multiPvResolver) {
                            stockfish._multiPvResolver = null;
                            resolve(Array.from(localMultiPvMoves));
                        }
                    }, 5000);
                });
                localMoves.forEach(m => possibleMoves.add(m));
                stockfish.postMessage('setoption name MultiPV value 1');
            } catch(e) {}
        })());
    }

    await Promise.allSettled(promises);
    let moveArray = Array.from(possibleMoves).filter(Boolean);

    if (moveArray.length === 0) {
        let chessTemp = new Chess(fen);
        let moves = chessTemp.moves({verbose:true});
        if(!moves.length) return null;
        let rm = moves[Math.floor(Math.random()*moves.length)];
        return rm.from + rm.to + (rm.promotion||'');
    }
    return moveArray[Math.floor(Math.random() * moveArray.length)];
}

async function getPreAnalysis(prevFen) {
  if (isOnline()) {
    try {
      $('#curDepth').text(`${ENGINE_CONFIG.PRE_ANALYSIS_CLOUD_FALLBACK_DEPTH}/Adp`);
      const cloudData = await executeCloudWithRetry(prevFen, ENGINE_CONFIG.PRE_ANALYSIS_CLOUD_FALLBACK_DEPTH, ENGINE_CONFIG.PRE_ANALYSIS_CLOUD_RETRIES);
      const formatted = formatCloudResult(cloudData);
      return { fen: prevFen, info: formatted.info, bestmove: formatted.bestmove, perspective: ENGINE_CONFIG.CLOUD_API_PERSPECTIVE };
    } catch (err) {
      console.warn('Cloud pre-analysis failed:', err.message);
      if (moveCount > LICHESS_DB_ACTIVE_MOVES) setStatus('⚠️ Cloud pre-analysis failed, using local engine...');
    }
  } else {
    console.log('Skipping cloud pre-analysis: offline.');
  }
  return new Promise((resolve) => {
    if (!stockfish) {
      resolve({ fen: prevFen, info: null, bestmove: null, perspective: ENGINE_CONFIG.LOCAL_PERSPECTIVE });
      return;
    }
    preAnalysisResult = { fen: prevFen, info: null, bestmove: null, waitingFor: 'pre' };
    try {
      stockfish.postMessage('stop');
      stockfish.postMessage('ucinewgame');
      stockfish.postMessage(`position fen ${prevFen}`);
      currentSFDepth = 0;
      $('#curDepth').text('0/Adp');
      stockfish.postMessage(`go depth ${ENGINE_CONFIG.PRE_ANALYSIS_DEPTH}`);
      let waited = 0;
      const intv = setInterval(() => {
        if (preAnalysisResult.info || waited >= 40) {
          clearInterval(intv);
          resolve({
            fen: prevFen,
            info: preAnalysisResult.info || null,
            bestmove: preAnalysisResult.bestmove,
            perspective: ENGINE_CONFIG.LOCAL_PERSPECTIVE
          });
        }
        waited++;
      }, 100);
    } catch (e) {
      console.warn('Local pre-analysis failed init:', e);
      resolve({ fen: prevFen, info: null, bestmove: null, perspective: ENGINE_CONFIG.LOCAL_PERSPECTIVE });
    }
  });
}

async function getBestMoveWithFallback(fen) {
  const isEarlyGame = moveCount <= LICHESS_DB_ACTIVE_MOVES;
  let engineSource = '';
  let perspective = 'side';
  if (isOnline()) {
    try {
      $('#curDepth').text(`${ENGINE_CONFIG.CLOUD_FALLBACK_DEPTH}/Adp`);
      const cloudData = await executeCloudWithRetry(fen, ENGINE_CONFIG.CLOUD_FALLBACK_DEPTH, ENGINE_CONFIG.CLOUD_MAX_RETRIES);
      engineSource = 'Stockfish 18';
      perspective = ENGINE_CONFIG.CLOUD_API_PERSPECTIVE;
      return { ...formatCloudResult(cloudData), source: engineSource, perspective };
    } catch (cloudError) {
      console.warn('Cloud main move failed:', cloudError.message);
      if (!isEarlyGame) setStatus('⚠️ Cloud failed — trying local');
    }
  } else {
    console.log('Skipping cloud main move: offline.');
  }

  if (isEarlyGame && isOnline()) {
    try {
      const lichessMove = await getLichessRandomMove(fen, LICHESS_DB_TOP_N);
      if (lichessMove) {
        engineSource = 'Lichess Database';
        perspective = ENGINE_CONFIG.LICHESS_PERSPECTIVE;
        return { bestmove: lichessMove, info: null, source: engineSource, perspective };
      }
    } catch (e) {
      console.warn('Lichess early fallback failed:', e.message);
    }
  } else if (isEarlyGame) {
    console.log('Skipping Lichess early game fallback: offline.');
  }

  if (stockfish) {
    try {
      const localRes = await getLocalBestMove(fen, ENGINE_CONFIG.LOCAL_FALLBACK_DEPTH, ENGINE_CONFIG.LOCAL_ENGINE_TIMEOUT_MS);
      engineSource = 'Stockfish 11';
      perspective = ENGINE_CONFIG.LOCAL_PERSPECTIVE;
      return { bestmove: localRes.move, info: localRes.info || null, source: engineSource, perspective };
    } catch (err) {
      console.warn('Local engine failed:', err.message);
      if (!isEarlyGame) setStatus('⚠️ Local failed — attempting final cloud or fallback.');
    }
  } else {
    console.log('No local engine available; will try final cloud (if online) or simple fallback.');
  }

  if (ENGINE_CONFIG.FINAL_CLOUD_RETRY && isOnline()) {
    try {
      $('#curDepth').text(`${ENGINE_CONFIG.FINAL_CLOUD_DEPTH}/Adp`);
      const finalCloudData = await executeCloudWithRetry(fen, ENGINE_CONFIG.FINAL_CLOUD_DEPTH, 1);
      engineSource = 'Final Stockfish';
      perspective = ENGINE_CONFIG.CLOUD_API_PERSPECTIVE;
      return { ...formatCloudResult(finalCloudData), source: engineSource, perspective };
    } catch (finalErr) {
      console.warn('Final cloud attempt failed:', finalErr.message);
      if (!isEarlyGame) setStatus('⚠️ All engines failed — will use simple logic.');
    }
  } else {
    console.log('Skipping final cloud attempt (offline or disabled).');
  }
  return null;
}

function formatCloudResult(data) {
  let cpVal = null;
  if (data.centipawns !== undefined) cpVal = data.centipawns;
  else if (data.centipawn !== undefined) cpVal = data.centipawn;
  else if (data.cp !== undefined) cpVal = data.cp;
  else if (data.eval && data.eval.centipawn !== undefined) cpVal = data.eval.centipawn;
  return {
    bestmove: data.move || data.bestmove || data.mv || null,
    info: (cpVal !== null) ? { type: 'cp', value: parseInt(cpVal, 10) } : null
  };
}

function getSimpleBestMove(fen) {
  const chess = new Chess(fen);
  const moves = chess.moves({ verbose: true });
  if (!moves.length) return null;
  let bestMove = null;
  let bestScore = -Infinity;
  const engineSide = chess.turn();
  for (const m of moves) {
    chess.move(m);
    const s = evaluatePosition(chess, engineSide);
    chess.undo();
    if (s > bestScore) { bestScore = s; bestMove = m; }
  }
  if (!bestMove) return null;
  return bestMove.from + bestMove.to + (bestMove.promotion || '');
}

function evaluatePosition(chess, forSide) {
  const b = chess.board();
  let sc = 0;
  for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) {
    const p = b[i][j];
    if (!p) continue;
    let v = 0;
    switch (p.type) {
      case 'p': v = 100; break;
      case 'n': v = 320; break;
      case 'b': v = 330; break;
      case 'r': v = 500; break;
      case 'q': v = 900; break;
      case 'k': v = 20000; break;
    }
    sc += (p.color === 'w') ? v : -v;
  }
  return forSide === 'w' ? sc : -sc;
}

async function playSimpleEngineFallback() {
  setStatus('⚠️ All engines failed or unavailable. Using simple fallback.');
  const fen = game.fen();
  const moveUci = getSimpleBestMove(fen);

    const survivors = MESSAGES.survivor.slice();
    for (let i = 0; i < survivors.length; i++) {
      setStatus(`<span class="typewriter">${escapeHtml(survivors[i])}</span>`);
      await sleep(1000);
    }
    makeEngineMove(moveUci);
  } else {
    setStatus('No legal moves left. GG.');
  }
}

function uciToSan(fen, uci) {
  if (!uci) return null;
  try {
    const chess = new Chess(fen);
    const from = uci.slice(0, 2);
    const to = uci.slice(2, 4);
    const promo = uci.length === 5 ? uci[4] : undefined;
    const mv = chess.move({ from, to, promotion: promo });
    return mv ? mv.san : null;
  } catch (e) {
    console.warn('uciToSan error', e);
    return null;
  }
}

function infoToWhiteCp(info, turn, perspective) {
  if (!info) return null;
  let cp = 0;
  if (info.type === 'cp') cp = info.value;
  else if (info.type === 'mate') cp = info.value > 0 ? 100000 - info.value : -100000 - info.value;
  if (perspective === 'white') return cp;
  if (perspective === 'side') return (turn === 'w') ? cp : -cp;
  return (turn === 'w') ? cp : -cp;
}

// "See Why" English Translation Engine
function translateMoveToEnglish(moveObj) {
    if (!moveObj) return "You made a move";
    const pieces = { p: 'pawn', n: 'knight', b: 'bishop', r: 'rook', q: 'queen', k: 'king' };
    let pName = pieces[moveObj.piece] || 'piece';

    if (moveObj.san.startsWith('O-O-O')) {
        let ending = moveObj.san.includes('#') ? ' and delivered checkmate' : (moveObj.san.includes('+') ? ' and gave a check' : '');
        return `You castled queenside${ending}.`;
    }
    if (moveObj.san.startsWith('O-O')) {
        let ending = moveObj.san.includes('#') ? ' and delivered checkmate' : (moveObj.san.includes('+') ? ' and gave a check' : '');
        return `You castled kingside${ending}.`;
    }

    let action = `moved your ${pName} to ${moveObj.to}`;
    if (moveObj.captured) {
        let cName = pieces[moveObj.captured] || 'piece';
        action = `captured the ${cName} on ${moveObj.to} with your ${pName}`;
    }

    if (moveObj.flags && moveObj.flags.includes('e')) {
        action = `captured a pawn en passant on ${moveObj.to} with your ${pName}`;
    }
    if (moveObj.promotion) {
        action += ` and promoted to a ${pieces[moveObj.promotion] || 'piece'}`;
    }
    if (moveObj.san && moveObj.san.includes('#')) {
        action += ' and delivered checkmate';
    } else if (moveObj.san && moveObj.san.includes('+')) {
        action += ' and gave a check';
    }

    return `You ${action}.`;
}

window.explainWhy = async function() {
    if (!window.currentBlunderData || window.isExplaining) return;
    window.isExplaining = true;
    let d = window.currentBlunderData;
    
    $('.btn-see-why').text('🔍 Analyzing...').css('opacity', '0.7').prop('disabled', true);

    let desc = translateMoveToEnglish(d.userMove);

    // Deep analysis (Cloud Depth 18 -> Local Depth 10)
    let deepCloudFailed = false;
    let deeperEval = null;
    if (isOnline()) {
       try {
           const body = JSON.stringify({ fen: d.postFen, depth: 18 });
           const resp = await fetchWithTimeout(ENGINE_CONFIG.CLOUD_API_URL, {
             method: 'POST', headers: {'Content-Type': 'application/json'}, body
           }, 15000);
           deeperEval = await resp.json();
       } catch(e) { deepCloudFailed = true; }
    } else { deepCloudFailed = true; }

    if (deepCloudFailed && stockfish) {
       try {
           deeperEval = await getLocalBestMove(d.postFen, 10, 8000);
       } catch(e) {}
    }

    // Identify Reason
    let turn = d.userMove.color;
    let playerPreCp = turn === 'w' ? d.preCp : -d.preCp;
    let playerPostCp = turn === 'w' ? d.postCp : -d.postCp;
    let drop = playerPreCp - playerPostCp;
    let reason = "";

    if (playerPreCp > 150 && playerPostCp < -50) reason = "Turning a Win into a Loss: You completely threw away a winning position.";
    else if (playerPreCp > 150 && playerPostCp < 50) reason = "Turning a Win into a Draw: You let your clear advantage slip away.";
    else if (drop > 300) reason = "Hanging a Piece or Missing a Tactic: You lost a huge amount of material or missed a devastating combination.";
    else if (drop > 150) reason = "Evaluation Drop: You worsened your position significantly by misplacing pieces or miscalculating.";
    else reason = "Positional Ruin: You damaged your pawn structure or piece coordination, making your position fundamentally worse.";

    const explanationHtml = `<div style="margin-top:12px; padding:12px; background:rgba(0,0,0,0.25); border-radius:10px; font-size:13px; color:#eaeaea; border-left:4px solid #0b875b; line-height: 1.5; text-align: left;">
        <strong style="color:#10b981; font-size:14px;">💡 Decode:</strong> ${desc}<br><br>
        <strong style="color:#ff4d4f; font-size:14px;">⚠️ Reason:</strong> <span style="color:#ffa9a9;">${reason}</span>
    </div>`;
    
    $('.btn-see-why').hide();
    $('#status .bot-msg').append(explanationHtml);
    window.isExplaining = false;
};


async function executeMove(source, target, promotionPiece = 'q', byPlayer = false, oldFen = null) {
  if (isAnalyzing) return false;
  const move = game.move({ from: source, to: target, promotion: promotionPiece });
  if (!move) return false;
  if (byPlayer) {
    moveHistoryData.push({ san: move.san });
    moveCount++;
  }
  board.position(game.fen(), true);
  highlightLastMove(source, target);
  removeHighlights();
  sourceSquare = null;
  updateUI();
  if (game.game_over()) {
    handleGameOver();
    return true;
  }
  if (byPlayer) {
    setStatus('Processing your poor choices...');
    setEngineStatus('♜ thinking<span class="dots"></span>');
    isAnalyzing = true;
    const prevFen = oldFen || performUndoRedoHack(source, target, promotionPiece);
    const currentFen = game.fen();
    const pre = await getPreAnalysis(prevFen);
    const post = await getBestMoveWithFallback(currentFen);
    if (post) {
      if (post.source) setEngineStatus(`⚙️ using ${post.source}`);
      await evaluateBlunderAndMove(pre, post);
    } else {
      setEngineStatus('Engine Fails ×᷼×');
      await playSimpleEngineFallback();
    }
    resetStockfishToFen(game.fen());
    isAnalyzing = false;
    setTimeout(clearEngineStatus, 1500);
  }
  return true;
}

function performUndoRedoHack(source, target, promotionPiece) {
  game.undo();
  const prev = game.fen();
  game.move({ from: source, to: target, promotion: promotionPiece });
  return (typeof prev === 'string' && prev.split(/\s+/).length === 6) ? prev : 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
}

function resetStockfishToFen(fen) {
  if (!stockfish) return;
  try {
    stockfish.postMessage('stop');
    stockfish.postMessage('ucinewgame');
    stockfish.postMessage(`position fen ${fen}`);
    preAnalysisResult = null;
    currentSFDepth = 0;

}

function makeEngineMove(moveStr) {
  if (!moveStr) return;
  try {
    const from = moveStr.slice(0, 2);
    const to = moveStr.slice(2, 4);
    const promo = moveStr.length === 5 ? moveStr[4] : 'q';
    const move = game.move({ from, to, promotion: promo });
    if (move) {
      moveHistoryData.push({ san: move.san });
      moveCount++;
      board.position(game.fen(), true);
      highlightLastMove(move.from, move.to);
      resetStockfishToFen(game.fen());
      updateUI();
      if (game.game_over()) handleGameOver();
    } else {
      throw new Error('Engine suggested illegal move: ' + moveStr);
    }
  } catch (error) {
    console.error('Failed executing Engine Move:', error);
    setStatus('Engine generated invalid data. Resign now.');
  }
}

async function evaluateBlunderAndMove(pre, post) {
  if (!post || !post.info) {
    setStatus(MESSAGES.praise[Math.floor(Math.random()*MESSAGES.praise.length)]);
    if (post && post.bestmove) makeEngineMove(post.bestmove);
    return;
  }

  const preTurn = pre.fen.split(' ')[1];
  const postTurn = game.turn();
  const preWhiteCpRaw = infoToWhiteCp(pre.info, preTurn, pre.perspective || ENGINE_CONFIG.LOCAL_PERSPECTIVE);
  const postWhiteCpRaw = infoToWhiteCp(post.info, postTurn, post.perspective || ENGINE_CONFIG.LOCAL_PERSPECTIVE);

  const preWhiteCp = (preWhiteCpRaw !== null) ? preWhiteCpRaw : (lastEvalCp !== null ? lastEvalCp : 0);
  const postWhiteCp = (postWhiteCpRaw !== null) ? postWhiteCpRaw : preWhiteCp;

  lastEvalCp = postWhiteCp;

  const deltaCp = preWhiteCp - postWhiteCp;

  const lastMoveObj = moveHistoryData[moveHistoryData.length - 1];
  const lastMoveSan = lastMoveObj ? lastMoveObj.san : 'That move';
  let bestUci = pre && pre.bestmove;
  let bestSan = bestUci ? uciToSan(pre.fen, bestUci) : null;
  let bestDisplay = bestSan || bestUci || 'something else';

  if (bestDisplay === 'something else') {
    try {
      if (stockfish) {
        setEngineStatus('⚙️ trying local short fallback...');
        let tryLocal = null;
        for (let attempt = 0; attempt < ENGINE_CONFIG.LOCAL_RETRY_COUNT; attempt++) {
          tryLocal = await getLocalBestMove(pre.fen, ENGINE_CONFIG.LOCAL_RETRY_DEPTH, ENGINE_CONFIG.LOCAL_RETRY_TIMEOUT_MS).catch(() => null);
          if (tryLocal && tryLocal.move) break;
          await sleep(250 * (attempt + 1));
        }
        if (tryLocal && tryLocal.move) {
          bestUci = tryLocal.move;
          bestSan = uciToSan(pre.fen, tryLocal.move);
          bestDisplay = bestSan || tryLocal.move || 'something else';
        }
      }
    } catch (e) {
    } finally {
      if (post && post.source) setEngineStatus(`⚙️ using ${post.source}`);
    }
  }

  const bestDisplayForMsg = bestDisplay;
  let isMistakeOrBlunder = false;

  if (deltaCp > ENGINE_CONFIG.THRESHOLDS.BLUNDER) {
    isMistakeOrBlunder = true;
    const fn = MESSAGES.blunder[Math.floor(Math.random() * MESSAGES.blunder.length)];
    setStatus(fn(lastMoveSan, bestDisplayForMsg));
  } else if (deltaCp > ENGINE_CONFIG.THRESHOLDS.MISTAKE) {
    isMistakeOrBlunder = true;
    const fn = MESSAGES.mistake[Math.floor(Math.random() * MESSAGES.mistake.length)];
    setStatus(fn(lastMoveSan, bestDisplayForMsg));
  } else if (deltaCp > ENGINE_CONFIG.THRESHOLDS.INACCURACY) {
    const fn = MESSAGES.inaccuracy[Math.floor(Math.random() * MESSAGES.inaccuracy.length)];
    setStatus(fn(lastMoveSan, bestDisplayForMsg));
  } else {
    const praise = MESSAGES.praise[Math.floor(Math.random() * MESSAGES.praise.length)];
    setStatus(praise);
  }

  // Append 'See Why' feature if mistake or blunder
  if (isMistakeOrBlunder) {
      window.currentBlunderData = {
          fen: pre.fen,
          postFen: game.fen(),
          preCp: preWhiteCp,
          postCp: postWhiteCp,
          userMove: game.history({verbose:true}).pop() 
      };
      // requestAnimationFrame to guarantee wrapper is present
      setTimeout(() => {
          $('#status .bot-msg').append(`<br><button class="btn-see-why" onclick="explainWhy()">🔍 See Why</button>`);
      }, 50);
  }

  updateEval(postWhiteCp);
  renderPGN();

  const moveDelay = deltaCp > ENGINE_CONFIG.THRESHOLDS.BLUNDER ? 2500 : 1000;
  setTimeout(() => {
    if (post.bestmove) makeEngineMove(post.bestmove);
    else if (!isMistakeOrBlunder) setStatus(MESSAGES.praise[Math.floor(Math.random()*MESSAGES.praise.length)]);
  }, moveDelay);
}

function removeHighlights() {
  $('#myBoard .square-55d63').removeClass('highlight-hint highlight-capture check-square highlight-selected highlight-last-move');
}
function highlightLastMove(from, to) {
  $('#myBoard .square-55d63').removeClass('highlight-last-move');
  $(`#myBoard .square-${from}`).addClass('highlight-last-move');
  $(`#myBoard .square-${to}`).addClass('highlight-last-move');
}
function updateEval(scoreCp) {
  if (scoreCp === null || scoreCp === undefined) return;
  lastEvalCp = scoreCp;
  const display = scoreCp / 100;
  const maxAbs = ENGINE_CONFIG.EVAL_CLAMP_ABS || 9.5;
  const clamped = Math.max(-maxAbs, Math.min(maxAbs, display));
  const percentage = Math.round(50 + (clamped / maxAbs) * 50);
  let prefix = display > 0 ? '+' : '';
  $('#evalScore').text(prefix + display.toFixed(2));
  $('#evalBar').css('height', `${Math.max(0, Math.min(100, percentage))}%`);
}
function renderPGN() {
  const sans = moveHistoryData.map(i => i.san);
  let lines =[];
  for (let i = 0; i < sans.length; i += 2) {
    const moveNo = Math.floor(i / 2) + 1;
    const whiteMove = sans[i] || '';
    const blackMove = sans[i + 1] || '';
    if (blackMove) lines.push(`${moveNo}. ${whiteMove} ${blackMove}`);
    else lines.push(`${moveNo}. ${whiteMove}`);
  }
  $('#pgnArea').text(lines.join('\n'));
  $('#pgnArea').scrollTop($('#pgnArea')[0].scrollHeight);
}
function handleGameOver() {
  let msg = 'Game Over!';
  if (game.in_checkmate()) msg += ' Checkmate.';
  else if (game.in_draw()) msg += ' Draw.';
  else if (game.in_stalemate()) msg += ' Stalemate.';
  else if (game.in_threefold_repetition()) msg += ' Repetition.';
  setStatus(msg);
  clearEngineStatus();
}
function getKingSquare(side) {
  const b = game.board();
  for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) {
    const p = b[i][j];
    if (p && p.type === 'k' && p.color === side) return String.fromCharCode(97 + j) + (8 - i);
  }
  return null;
}
function updateUI() {
  $('#myBoard .square-55d63').removeClass('check-square');

}

function onSquareClick(square) {
  if (game.game_over() || isAnalyzing) return;
  const piece = game.get(square);
  if (sourceSquare) {
    const moves = game.moves({ square: sourceSquare, verbose: true });
    const validMove = moves.find(m => m.to === square);
    if (validMove) {
      if (isPromotion(sourceSquare, square)) {
        showPromotionDialog(sourceSquare, square, game.fen());
      } else {
        executeMove(sourceSquare, square, 'q', true, game.fen());

    removeHighlights();
    showLegalMoves(square);

    sourceSquare = null;

    else targetSquare.addClass('highlight-hint');
  });
}

async function enginePlayMoveFromAPI() {
  const fen = game.fen();
  let engineResponse = null;
  setEngineStatus('♜ thinking<span class="dots">...</span>');
  
  if (moveCount === 0) {
    const firstMoveUci = await getFirstMove(fen);
    if (firstMoveUci) {

  }

  if (engineResponse) {
    if (engineResponse.source) setEngineStatus(`⚙️ using ${engineResponse.source}`);
    makeEngineMove(engineResponse.bestmove);
  } else {
    setEngineStatus('🎲 using simple logic');
    await playSimpleEngineFallback();
  }
  setTimeout(clearEngineStatus, 1500);
}

const pieceTheme = 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png';
const getRandom = (arr) => arr[Math.floor(Math.random() * arr.length)];

const config = { draggable: false, position: 'start', pieceTheme };
try {
  board = Chessboard('myBoard', config);
  $(window).resize(board.resize);
} catch (e) {
  console.error('Board UI initialization failed. Check libraries.', e);
}
$('#pgnArea').css({ 'white-space': 'pre', 'font-family': 'Consolas, Menlo, monospace' });

function startGame(color) {
  playerColor = color;
  $('#gameModal').hide();
  board.orientation(color === 'w' ? 'white' : 'black');
  game.reset();
  board.position(game.fen(), true);
  moveCount = 0;
  lastEvalCp = null;
  window.currentBlunderData = null; // নতুন গেম শুরু হলে ব্লান্ডার ডেটা ক্লিয়ার করবে
  window.isExplaining = false;
  if(localMultiPvMoves) localMultiPvMoves.clear();

  renderPGN();
  clearEngineStatus();
  
  if (!stockfish) initStockfish();
  else {
    try {
      stockfish.postMessage('ucinewgame');
      stockfish.postMessage('position startpos');
      $('#curDepth').text('0/Adp');
    } catch (e) { console.warn('Failed to reset stockfish', e); }
  }
  
  setStatus('Game started. Show me your pathetic skills.');
  
  if (playerColor === 'b') {
    setStatus('Bot is calculating your destruction...');
    enginePlayMoveFromAPI();
  }
}

window.startGame = startGame;
window.executePromotion = executePromotion;
window.copyPGN = copyPGN;

$(document).ready(() => {
  $('#curDepth').text('0/Adp');
  if (isOnline()) initStockfish();
  else setEngineStatus('⚠️ Offline mode active — local/simple only.');
});
</script>
