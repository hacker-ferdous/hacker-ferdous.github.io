<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Face AI</title>
<style>
  :root{
    --panel:rgba(18,24,38,.9);
    --border:rgba(255,255,255,.09);
    --accent:#00e5a0;
    --accent2:#00b3ff;
    --warn:#ffb020;
    --danger:#ff4d6d;
    --text:#e6edf7;
    --muted:#8b9bb4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;min-height:100vh;
    background:radial-gradient(1200px 700px at 50% -15%,#16233a 0%,#070a12 55%) fixed;
    color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;align-items:center;
    padding:22px 14px 44px;
  }
  h1{font-size:clamp(19px,4.2vw,28px);margin:0 0 18px;letter-spacing:.3px;text-align:center}
  h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .wrap{width:100%;max-width:1100px}

  .stage{
    position:relative;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;
    background:#000;border:1px solid var(--border);
    box-shadow:0 24px 70px rgba(0,0,0,.65),0 0 0 1px rgba(0,229,160,.07);
  }
  video,canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  video{object-fit:cover;background:#000;transform-origin:center}
  video.mirrored{transform:scaleX(-1)}
  canvas{pointer-events:none;z-index:2}

  .overlay{
    position:absolute;inset:0;z-index:6;display:flex;
    flex-direction:column;gap:16px;align-items:center;justify-content:center;
    background:rgba(5,8,14,.88);backdrop-filter:blur(10px);
    text-align:center;padding:24px;transition:opacity .3s;
  }
  .overlay.hidden{display:none}
  .overlay h2{margin:0;font-size:clamp(18px,3.5vw,24px)}
  .overlay p{margin:0;color:var(--muted);font-size:13.5px;max-width:460px;line-height:1.6}
  .big-btn{
    font:inherit;font-weight:700;font-size:15px;
    color:#04170f;background:linear-gradient(135deg,var(--accent),#00c48a);
    border:none;padding:14px 28px;border-radius:12px;cursor:pointer;
    box-shadow:0 8px 30px rgba(0,229,160,.35);
    display:inline-flex;align-items:center;gap:9px;transition:.2s;
  }
  .big-btn:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(0,229,160,.5)}
  .big-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

  .loader{
    position:absolute;inset:0;z-index:5;display:none;
    flex-direction:column;gap:14px;align-items:center;justify-content:center;
    background:rgba(5,8,14,.85);backdrop-filter:blur(6px);
  }
  .loader.show{display:flex}
  .spinner{
    width:46px;height:46px;border-radius:50%;
    border:3px solid rgba(0,229,160,.18);border-top-color:var(--accent);
    animation:spin .9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .loader p{margin:0;color:var(--muted);font-size:14px;text-align:center;padding:0 20px}

  .hud{position:absolute;top:12px;left:12px;right:12px;z-index:4;
    display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
  .chip{
    display:inline-flex;align-items:center;gap:7px;
    background:rgba(8,12,20,.72);backdrop-filter:blur(8px);
    border:1px solid var(--border);border-radius:999px;
    padding:6px 13px;font-size:12.5px;font-weight:600;letter-spacing:.3px;
  }
  .chip b{color:var(--accent);font-variant-numeric:tabular-nums}
  .dot{width:8px;height:8px;border-radius:50%;background:#5a6b82;transition:.3s}
  .dot.live{background:var(--accent);box-shadow:0 0 10px var(--accent);animation:pulse 1.4s infinite}
  .dot.error{background:var(--danger);box-shadow:0 0 10px var(--danger)}
  .dot.loading{background:var(--warn);box-shadow:0 0 10px var(--warn)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  .controls{
    margin-top:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:12px;backdrop-filter:blur(10px);
  }
  button{
    font:inherit;font-weight:600;font-size:13.5px;color:var(--text);
    background:rgba(255,255,255,.05);border:1px solid var(--border);
    padding:10px 16px;border-radius:10px;cursor:pointer;transition:.18s;
    display:inline-flex;align-items:center;gap:7px;
  }
  button:hover{background:rgba(255,255,255,.1);transform:translateY(-1px)}
  button.primary{
    background:linear-gradient(135deg,var(--accent),#00c48a);
    color:#04170f;border-color:transparent;
    box-shadow:0 6px 22px rgba(0,229,160,.3);
  }
  button.active{border-color:var(--accent);color:var(--accent)}
  button:disabled{opacity:.45;cursor:not-allowed;transform:none}

  .slider{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-left:auto}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:120px;height:4px;border-radius:4px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:#fff;box-shadow:0 0 8px rgba(0,229,160,.8);cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:16px;height:16px;border:none;border-radius:50%;background:#fff;
    box-shadow:0 0 8px rgba(0,229,160,.8);cursor:pointer;
  }
  .slider b{color:var(--accent);font-variant-numeric:tabular-nums;min-width:34px}

  .faces-panel{
    margin-top:16px;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;
  }
  .face-card{
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:12px;backdrop-filter:blur(10px);position:relative;
    animation:cardIn .25s ease;
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .face-card .head{display:flex;gap:10px;align-items:center;margin-bottom:10px}
  .face-card .thumb{
    width:52px;height:52px;border-radius:10px;object-fit:cover;
    border:2px solid var(--accent);background:#000;flex:none;
  }
  .face-card .id-title{flex:1;min-width:0}
  .face-card .name-input{
    width:100%;font:inherit;font-weight:700;font-size:14px;
    background:rgba(255,255,255,.05);border:1px solid var(--border);
    color:var(--text);padding:5px 8px;border-radius:7px;outline:none;
    margin-bottom:4px;
  }
  .face-card .name-input:focus{border-color:var(--accent)}
  .face-card .name-input::placeholder{color:var(--muted);font-weight:500}
  .face-card .id-title small{display:block;color:var(--muted);font-weight:500;font-size:11px}
  .face-card .emoji{font-size:24px;margin-left:auto}

  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .badge{
    font-size:11px;font-weight:700;letter-spacing:.3px;
    padding:4px 9px;border-radius:999px;border:1px solid transparent;
    display:inline-flex;align-items:center;gap:5px;
  }
  .badge.live{background:rgba(0,229,160,.14);color:var(--accent);border-color:rgba(0,229,160,.4)}
  .badge.neutral{background:rgba(255,255,255,.06);color:var(--muted);border-color:var(--border)}

  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:11.5px}
  .metric{background:rgba(255,255,255,.03);border-radius:8px;padding:7px 9px}
  .metric .lbl{color:var(--muted);font-size:10.5px;margin-bottom:3px;letter-spacing:.2px}
  .metric .val{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}

  .bar{height:5px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:5px}
  .bar > i{display:block;height:100%;border-radius:3px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .25s}

  .error-msg{
    color:var(--danger);font-size:13px;font-weight:600;
    background:rgba(255,77,109,.1);border:1px solid rgba(255,77,109,.3);
    padding:10px 16px;border-radius:10px;max-width:480px;line-height:1.5;
  }
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:16px;
    border:1px dashed var(--border);border-radius:12px;grid-column:1/-1}

  /* People list */
  .section-title{
    margin:24px 0 10px;font-size:14px;font-weight:700;
    color:var(--muted);letter-spacing:.6px;text-transform:uppercase;
  }
  .people-panel{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;
  }
  .person-card{
    display:flex;gap:10px;align-items:center;cursor:pointer;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:10px;transition:.18s;
  }
  .person-card:hover{border-color:var(--accent);transform:translateY(-2px);
    box-shadow:0 8px 24px rgba(0,229,160,.12)}
  .person-thumb{
    width:48px;height:48px;border-radius:9px;object-fit:cover;
    border:2px solid var(--accent);background:#0a0e17;flex:none;
  }
  .person-info{min-width:0;flex:1}
  .person-name{font-weight:700;font-size:13.5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .person-meta-1{color:var(--muted);font-size:11px;margin-top:2px}
  .person-meta-2{color:var(--muted);font-size:10.5px;margin-top:1px}

  /* Modal */
  .modal{
    position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.78);
    display:none;align-items:center;justify-content:center;padding:18px;
    backdrop-filter:blur(6px);
  }
  .modal.show{display:flex}
  .modal-box{
    background:#101827;border:1px solid var(--border);border-radius:16px;
    width:100%;max-width:560px;max-height:90vh;overflow-y:auto;
    padding:20px;position:relative;
    box-shadow:0 24px 70px rgba(0,0,0,.7);
  }
  .modal-close{
    position:absolute;top:12px;right:12px;
    width:32px;height:32px;padding:0;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;line-height:1;
  }
  .modal-head{display:flex;gap:14px;align-items:center;margin-bottom:18px;padding-right:36px}
  .modal-thumb{
    width:72px;height:72px;border-radius:12px;object-fit:cover;
    border:2px solid var(--accent);background:#0a0e17;flex:none;
  }
  .modal-head h2{margin:0;font-size:19px}
  .modal-head p{margin:3px 0;color:var(--muted);font-size:12px}
  .modal-section{
    border-top:1px solid var(--border);padding-top:14px;margin-top:14px;
  }
  .modal-section h3{
    margin:0 0 8px;font-size:12px;font-weight:700;
    color:var(--muted);letter-spacing:.5px;text-transform:uppercase;
  }
  .big-age{
    font-size:42px;font-weight:800;line-height:1;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .big-age small{font-size:14px;color:var(--muted);font-weight:600;margin-left:6px;
    -webkit-text-fill-color:var(--muted)}
  .modal-hint{color:var(--muted);font-size:11px;margin:6px 0 0}
  .modal-graph{
    width:100%;height:auto;aspect-ratio:5/3;display:block;
    background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:10px;
  }
  .session-list{list-style:none;padding:0;margin:0;max-height:180px;overflow-y:auto;
    font-size:12.5px}
  .session-list li{
    display:flex;justify-content:space-between;gap:10px;
    padding:7px 0;border-bottom:1px solid var(--border);
  }
  .session-list li:last-child{border-bottom:none}
  .session-list li span{color:var(--accent);font-weight:700}
  .session-list .active-session{color:var(--accent)}
  .danger-btn{
    width:100%;background:rgba(255,77,109,.12);color:var(--danger);
    border-color:rgba(255,77,109,.35);
  }
  .danger-btn:hover{background:rgba(255,77,109,.2)}
</style>
</head>
<body>

<h1>🧠 <span>Face AI</span></h1>

<div class="wrap">
  <div class="stage" id="stage">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>

    <div class="hud">
      <div class="chip"><span class="dot" id="dot"></span><span id="status">Booting…</span></div>
      <div class="chip">👤 <b id="faceCount">0</b></div>
      <div class="chip">🆔 <b id="trackCount">0</b></div>
      <div class="chip">⚡ <b id="fps">--</b></div>
    </div>

    <div class="loader" id="loader">
      <div class="spinner"></div>
      <p id="loaderText">Booting…</p>
    </div>

    <div class="overlay" id="startOverlay">
      <h2 id="overlayTitle">Starting…</h2>
      <p id="overlayMsg">Requesting camera…</p>
      <button class="big-btn" id="btnEnable">📷 Start</button>
      <p id="permissionError" class="error-msg" style="display:none"></p>
    </div>
  </div>

  <div class="controls">
    <button class="primary" id="btnStart" disabled>▶ Start</button>
    <button id="btnFlip" disabled>🔄 Flip</button>
    <button id="btnMirror" class="active" disabled>🪞 Mirror</button>
    <button id="btnReset" disabled>♻ Reset</button>

    <div class="slider">
      <label for="conf">Conf</label>
      <input type="range" id="conf" min="0.15" max="0.9" step="0.15" value="0.15">
      <b id="confVal">0.15</b>
    </div>
  </div>

  <div class="faces-panel" id="facesPanel">
    <div class="empty">No faces yet.</div>
  </div>

  <h2 class="section-title">👥 People</h2>
  <div class="people-panel" id="peoplePanel">
    <div class="empty">No saved people yet.</div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-box" id="modalBox"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.js"></script>
<script>
/* ============================================================ */
const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model/';

/* ---------- DOM ---------- */
const stage        = document.getElementById('stage');
const video        = document.getElementById('video');
const canvas       = document.getElementById('overlay');
const ctx          = canvas.getContext('2d');
const dotEl        = document.getElementById('dot');
const statusEl     = document.getElementById('status');
const faceCountEl  = document.getElementById('faceCount');
const trackCountEl = document.getElementById('trackCount');
const fpsEl        = document.getElementById('fps');
const btnStart     = document.getElementById('btnStart');
const btnFlip      = document.getElementById('btnFlip');
const btnMirror    = document.getElementById('btnMirror');
const btnReset     = document.getElementById('btnReset');
const btnEnable    = document.getElementById('btnEnable');
const startOverlay = document.getElementById('startOverlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlayMsg   = document.getElementById('overlayMsg');
const permError    = document.getElementById('permissionError');
const confRange    = document.getElementById('conf');
const confVal      = document.getElementById('confVal');
const loader       = document.getElementById('loader');
const loaderText   = document.getElementById('loaderText');
const facesPanel   = document.getElementById('facesPanel');
const peoplePanel  = document.getElementById('peoplePanel');
const modal        = document.getElementById('modal');
const modalBox     = document.getElementById('modalBox');

/* ---------- State ---------- */
let stream = null, running = false, rafId = null;
let facing = 'user', mirror = true;
let confidence = 0.15;
let lastDetectAt = 0, lastFrameTs = 0, fpsSmooth = 0;
let modelReady = false, options = null;
let listeners = [];
let lastDetections = [];
let videoReady = false;

/* ============================================================
   Utility
   ============================================================ */
function cosineSim(a, b){
  let d=0, na=0, nb=0;
  for (let i=0;i<a.length;i++){ d+=a[i]*b[i]; na+=a[i]*a[i]; nb+=b[i]*b[i]; }
  return d/(Math.sqrt(na)*Math.sqrt(nb)+1e-8);
}
function roundDescriptor(d){
  const arr = Array.from(d);
  return arr.map(v => Math.round(v * 1000) / 1000);
}
function fmtDuration(ms){
  const s = Math.round(ms/1000);
  if (s < 60) return s + 's';
  const m = Math.floor(s/60), rs = s % 60;
  if (m < 60) return m + 'm ' + rs + 's';
  const h = Math.floor(m/60), rm = m % 60;
  return h + 'h ' + rm + 'm';
}
function fmtTime(ts){
  const d = new Date(ts);
  const pad = n => String(n).padStart(2,'0');
  return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
}
function fmtAgo(ts){
  const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
  if (s < 60) return s + 's ago';
  const m = Math.floor(s/60);
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m/60);
  if (h < 24) return h + 'h ago';
  return Math.floor(h/24) + 'd ago';
}

/* ============================================================
   People store (persistent, keyed by face descriptor)
   ============================================================ */
const PEOPLE_KEY = 'faceai_people_v1';
const PERSON_MATCH_THRESHOLD = 0.55;
const MAX_AGES    = 100;   // last 100 age samples
const MAX_COORDS  = 10;    // last 10 coordinate samples
const MAX_SESSIONS= 100;   // last 100 sessions

let peopleCache = loadPeople();
let peopleDirty = false;

function loadPeople(){
  try { return JSON.parse(localStorage.getItem(PEOPLE_KEY) || '[]'); } catch { return []; }
}
function persistPeople(){
  try { localStorage.setItem(PEOPLE_KEY, JSON.stringify(peopleCache)); }
  catch(e){ console.warn('people save failed', e); }
}
function markPeopleDirty(){ peopleDirty = true; }
function flushPeople(){ if (peopleDirty){ persistPeople(); peopleDirty = false; } }
setInterval(flushPeople, 2000);

function findPersonByDescriptor(desc){
  if (!desc) return null;
  let best = null, bestSim = PERSON_MATCH_THRESHOLD;
  for (const p of peopleCache){
    if (!p.descriptor || !p.descriptor.length) continue;
    const s = cosineSim(p.descriptor, desc);
    if (s > bestSim){ bestSim = s; best = p; }
  }
  return best;
}
function getPersonById(id){
  return peopleCache.find(p => p.id === id) || null;
}
function createPerson(desc){
  const p = {
    id: 'p_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,6),
    name: '',
    descriptor: roundDescriptor(desc),
    ages: [],
    coords: [],
    sessions: [],
    totalMs: 0,
    firstSeen: Date.now(),
    lastSeen: Date.now(),
    thumb: null
  };
  peopleCache.push(p);
  markPeopleDirty();
  return p;
}

/* ============================================================
   Sessions — per-person "in front of camera" tracking
   ============================================================ */
const currentSessions = new Map(); // personId -> { start, last }
const SESSION_GAP_MS = 3000;

function tickSessions(activeTracks){
  const now = Date.now();
  for (const tr of activeTracks){
    if (!tr.personId) continue;
    let s = currentSessions.get(tr.personId);
    if (!s){
      s = { start: now, last: now };
      currentSessions.set(tr.personId, s);
    } else {
      s.last = now;
    }
    const p = getPersonById(tr.personId);
    if (p) p.lastSeen = now;
  }
  for (const [pid, s] of currentSessions){
    if (now - s.last > SESSION_GAP_MS){
      finalizeSession(pid, s);
      currentSessions.delete(pid);
    }
  }
  markPeopleDirty();
}

function finalizeSession(pid, s){
  const p = getPersonById(pid);
  if (!p) return;
  const dur = s.last - s.start;
  if (dur < 500) return; // ignore very short blips
  p.sessions.push({ start: s.start, end: s.last, duration: dur });
  if (p.sessions.length > MAX_SESSIONS) p.sessions.shift();
  p.totalMs += dur;
  markPeopleDirty();
}

function currentSessionDuration(pid){
  const s = currentSessions.get(pid);
  return s ? Date.now() - s.start : 0;
}
function totalPersonTime(p){
  return (p.totalMs || 0) + currentSessionDuration(p.id);
}
function avgAge(p){
  if (!p.ages || !p.ages.length) return null;
  return Math.round(p.ages.reduce((a,b)=>a+b,0) / p.ages.length);
}

/* ============================================================
   Live stats sampling (ages, coordinates)
   ============================================================ */
let lastAgeTick = 0, lastCoordTick = 0;
const AGE_TICK_MS = 500;
const COORD_TICK_MS = 1000;

function tickPersonStats(activeTracks){
  const now = Date.now();
  if (now - lastAgeTick > AGE_TICK_MS){
    lastAgeTick = now;
    for (const tr of activeTracks){
      if (!tr.personId || tr.age == null) continue;
      const p = getPersonById(tr.personId);
      if (!p) continue;
      p.ages.push(Math.round(tr.age));
      if (p.ages.length > MAX_AGES) p.ages.shift();
      markPeopleDirty();
    }
  }
  if (now - lastCoordTick > COORD_TICK_MS){
    lastCoordTick = now;
    const vw = video.videoWidth || 1, vh = video.videoHeight || 1;
    for (const tr of activeTracks){
      if (!tr.personId) continue;
      const p = getPersonById(tr.personId);
      if (!p) continue;
      const cx = (tr.box.x + tr.box.w/2) / vw;
      const cy = (tr.box.y + tr.box.h/2) / vh;
      p.coords.push({ x: +cx.toFixed(3), y: +cy.toFixed(3), t: now });
      if (p.coords.length > MAX_COORDS) p.coords.shift();
      if (tr.thumb) p.thumb = tr.thumb;
      markPeopleDirty();
    }
  }
}

/* ============================================================
   Web Worker — blur + texture
   ============================================================ */
const worker = (() => {
  const code = `
    self.onmessage = function(e){
      const { id, buffer, width, height } = e.data;
      const data = new Uint8ClampedArray(buffer);
      const gray = new Float32Array(width*height);
      for (let i=0;i<gray.length;i++){
        const j=i*4;
        gray[i] = 0.299*data[j] + 0.587*data[j+1] + 0.114*data[j+2];
      }
      let sum=0, sumSq=0, n=0;
      for (let y=1;y<height-1;y++){
        for (let x=1;x<width-1;x++){
          const i=y*width+x;
          const lap = -4*gray[i] + gray[i-1] + gray[i+1] + gray[i-width] + gray[i+width];
          sum += lap; sumSq += lap*lap; n++;
        }
      }
      const mean = sum/n;
      const blur = sumSq/n - mean*mean;
      let edges=0, total=0;
      for (let y=1;y<height-1;y+=2){
        for (let x=1;x<width-1;x+=2){
          const i=y*width+x;
          const c=gray[i];
          let code=0;
          if (gray[i-1]>c) code|=1;
          if (gray[i+1]>c) code|=2;
          if (gray[i-width]>c) code|=4;
          if (gray[i+width]>c) code|=8;
          let tr=0;
          for (let b=0;b<4;b++){
            const b1=(code>>b)&1, b2=(code>>((b+1)%4))&1;
            if (b1!==b2) tr++;
          }
          if (tr>=2) edges++;
          total++;
        }
      }
      const texture = total ? edges/total : 0;
      self.postMessage({ id, blur, texture });
    };
  `;
  const blob = new Blob([code], { type: 'application/javascript' });
  const w = new Worker(URL.createObjectURL(blob));
  const pending = new Map();
  let seq = 0;
  w.onmessage = (e) => {
    const cb = pending.get(e.data.id);
    if (cb) { cb(e.data); pending.delete(e.data.id); }
  };
  return {
    analyze(imageData){
      return new Promise((resolve) => {
        const id = ++seq;
        pending.set(id, resolve);
        const buf = imageData.data.buffer.slice(0);
        w.postMessage({ id, buffer: buf, width: imageData.width, height: imageData.height }, [buf]);
      });
    }
  };
})();

/* ============================================================
   Tracker — IoU + descriptor re-ID
   ============================================================ */
class FaceTracker {
  constructor(){
    this.tracks = new Map();
    this.lost = [];
    this.nextId = 1;
    this.iouThreshold = 0.25;
    this.maxMissingFrames = 12;
    this.lostTtlMs = 12000;
    this.reIdThreshold = 0.55;
  }
  reset(){ this.tracks.clear(); this.lost = []; this.nextId = 1; }
  iou(a,b){
    const x1=Math.max(a.x,b.x), y1=Math.max(a.y,b.y);
    const x2=Math.min(a.x+a.w,b.x+b.w), y2=Math.min(a.y+a.h,b.y+b.h);
    const inter=Math.max(0,x2-x1)*Math.max(0,y2-y1);
    const uni=a.w*a.h + b.w*b.h - inter;
    return uni>0 ? inter/uni : 0;
  }
  update(dets, ts){
    this.lost = this.lost.filter(l => ts - l.lostAt < this.lostTtlMs);
    const used = new Set();
    const active = [];
    for (const [id, tr] of this.tracks){
      let bestIdx = -1, bestIou = this.iouThreshold;
      dets.forEach((d, i) => {
        if (used.has(i)) return;
        const v = this.iou(tr.box, d.box);
        if (v > bestIou){ bestIou = v; bestIdx = i; }
      });
      if (bestIdx >= 0){
        used.add(bestIdx);
        this._refresh(tr, dets[bestIdx], ts);
        active.push(tr);
      } else {
        tr.missing++;
        if (tr.missing > this.maxMissingFrames){
          tr.lostAt = ts;
          this.lost.push(tr);
          this.tracks.delete(id);
        }
      }
    }
    dets.forEach((d, i) => {
      if (used.has(i)) return;
      let match = null;
      if (d.descriptor){
        for (let j=0;j<this.lost.length;j++){
          const l = this.lost[j];
          if (l.descriptor){
            const sim = cosineSim(l.descriptor, d.descriptor);
            if (sim > this.reIdThreshold){ match = j; break; }
          }
        }
      }
      if (match !== null){
        const l = this.lost.splice(match,1)[0];
        l.box = d.box; l.missing = 0; l.reIdCount = (l.reIdCount||0) + 1;
        this._refresh(l, d, ts);
        this.tracks.set(l.id, l);
        active.push(l);
      } else {
        const t = this._create(d, ts);
        this.tracks.set(t.id, t);
        active.push(t);
      }
    });
    return active;
  }
  _create(d, ts){
    return {
      id: this.nextId++,
      box: d.box,
      descriptor: d.descriptor,
      landmarks: d.landmarks,
      firstSeen: ts, lastSeen: ts, missing: 0,
      frames: 0,
      reIdCount: 0,
      name: null,
      personId: null,
      personChecked: false,
      earHistory: [], blinkCount: 0, eyesClosed: false,
      poseHistory: [], textureScores: [],
      blurScore: 0, brightnessScore: 0, sizeScore: 0, poseScore: 0,
      emotion: null, emotionScores: null,
      age: null, gender: null, genderProb: 0,
      quality: 0,
      liveness: 'live', livenessScore: 1,
      thumb: null, thumbAt: 0
    };
  }
  _refresh(tr, d, ts){
    tr.box = d.box;
    tr.landmarks = d.landmarks;
    tr.lastSeen = ts;
    tr.missing = 0;
    tr.frames++;
    if (d.descriptor) tr.descriptor = d.descriptor;
    if (d.emotion) tr.emotion = d.emotion;
    if (d.emotionScores) tr.emotionScores = d.emotionScores;
    if (d.age != null) tr.age = d.age;
    if (d.gender) { tr.gender = d.gender; tr.genderProb = d.genderProb; }
  }
}
const tracker = new FaceTracker();

/* ============================================================
   Detection loop
   ============================================================ */
const DETECT_INTERVAL = 60;
let frameCounter = 0;

async function detectLoop(){
  if (!running) return;
  rafId = requestAnimationFrame(detectLoop);

  const now = performance.now();
  if (now - lastDetectAt < DETECT_INTERVAL) return;
  if (video.readyState < 2 || !videoReady) return;
  if (!modelReady || !options) return;
  lastDetectAt = now;
  frameCounter++;

  syncCanvasSize();

  let results = [];
  try {
    const task = faceapi.detectAllFaces(video, options).withFaceLandmarks(true);
    const heavy = frameCounter % 4 === 0;
    const fullTask = heavy
      ? task.withFaceExpressions().withAgeAndGender().withFaceDescriptors()
      : task;
    results = await fullTask;
  } catch (e){ console.warn('detect error', e); return; }

  if (lastFrameTs){
    const inst = 1000 / Math.max(1, now - lastFrameTs);
    fpsSmooth = fpsSmooth ? fpsSmooth*0.85 + inst*0.15 : inst;
  }
  lastFrameTs = now;

  const dets = results.map(r => ({
    box: {
      x: r.detection.box.x,
      y: r.detection.box.y,
      w: r.detection.box.width,
      h: r.detection.box.height
    },
    score: r.detection.score,
    landmarks: r.landmarks || null,
    descriptor: r.descriptor ? Array.from(r.descriptor) : null,
    emotion: r.expressions ? topEmotion(r.expressions) : null,
    emotionScores: r.expressions ? { ...r.expressions } : null,
    age: r.age != null ? r.age : null,
    gender: r.gender || null,
    genderProb: r.genderProbability || 0
  }));

  const activeTracks = tracker.update(dets, now);

  // Link tracks to persistent people
  for (const tr of activeTracks){
    if (tr.personId || tr.personChecked) continue;
    if (!tr.descriptor) continue;
    tr.personChecked = true;
    let p = findPersonByDescriptor(tr.descriptor);
    if (!p) p = createPerson(tr.descriptor);
    tr.personId = p.id;
    if (p.name) tr.name = p.name;
  }

  // Analytics
  for (const tr of activeTracks){
    if (tr.landmarks) { computeEAR(tr); computePose(tr); }
    if (now - tr.thumbAt > 600){
      tr.thumbAt = now;
      tr.thumb = makeThumb(tr.box);
    }
  }
  if (frameCounter % 6 === 0 && activeTracks.length){
    const tr = activeTracks.reduce((a,b) =>
      (a.box.w*a.box.h > b.box.w*b.box.h) ? a : b);
    analyzeFace(tr).catch(()=>{});
  }
  for (const tr of activeTracks) computeQuality(tr);

  // Sessions + person stats
  tickSessions(activeTracks);
  tickPersonStats(activeTracks);

  draw(activeTracks);

  faceCountEl.textContent  = activeTracks.length;
  trackCountEl.textContent = tracker.tracks.size;
  fpsEl.textContent        = fpsSmooth ? fpsSmooth.toFixed(0) : '--';

  renderFacesPanel(activeTracks);

  lastDetections = activeTracks.map(tr => ({
    id: tr.id,
    x: tr.box.x, y: tr.box.y, width: tr.box.w, height: tr.box.h,
    emotion: tr.emotion, age: tr.age, gender: tr.gender,
    quality: tr.quality, name: tr.name,
    reIdCount: tr.reIdCount, blinkCount: tr.blinkCount
  }));
  listeners.forEach(cb => { try { cb(lastDetections, video); } catch(e){ console.error(e); } });
}

/* ============================================================
   Analytics helpers
   ============================================================ */
function topEmotion(expr){
  let best = 'neutral', bestV = 0;
  for (const k in expr){
    if (expr[k] > bestV){ bestV = expr[k]; best = k; }
  }
  return best;
}
function eyeAspectRatio(pts){
  const d = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
  return (d(pts[1],pts[5]) + d(pts[2],pts[4])) / (2 * d(pts[0],pts[3]) + 1e-6);
}
function computeEAR(tr){
  const p = tr.landmarks.positions;
  const left  = eyeAspectRatio([p[36],p[37],p[38],p[39],p[40],p[41]]);
  const right = eyeAspectRatio([p[42],p[43],p[44],p[45],p[46],p[47]]);
  const ear = (left + right) / 2;
  tr.earHistory.push(ear);
  if (tr.earHistory.length > 90) tr.earHistory.shift();
  const BLINK_TH = 0.19;
  if (ear < BLINK_TH && !tr.eyesClosed){
    tr.eyesClosed = true;
  } else if (ear > BLINK_TH && tr.eyesClosed){
    tr.eyesClosed = false;
    tr.blinkCount++;
  }
}
function computePose(tr){
  const p = tr.landmarks.positions;
  const leftEye = p[36], rightEye = p[45];
  const nose = p[30];
  const mouthL = p[48], mouthR = p[54];
  const eyeMidX = (leftEye.x + rightEye.x) / 2;
  const faceW = Math.hypot(rightEye.x-leftEye.x, rightEye.y-leftEye.y) + 1e-6;
  const yaw = (nose.x - eyeMidX) / faceW;
  const pitch = (nose.y - (leftEye.y + mouthL.y)/2) / (Math.abs(mouthL.y-leftEye.y)+1e-6);
  tr.poseHistory.push({ yaw, pitch });
  if (tr.poseHistory.length > 60) tr.poseHistory.shift();
}
async function analyzeFace(tr){
  const { x, y, w, h } = tr.box;
  const cw = 64, ch = 64;
  const c = document.createElement('canvas');
  c.width = cw; c.height = ch;
  const cx = c.getContext('2d', { willReadFrequently: true });
  cx.drawImage(video, x, y, w, h, 0, 0, cw, ch);
  const img = cx.getImageData(0, 0, cw, ch);
  const { blur, texture } = await worker.analyze(img);
  tr.blurScore = blur;
  tr.textureScores.push(texture);
  if (tr.textureScores.length > 20) tr.textureScores.shift();
  let sum = 0;
  for (let i=0;i<img.data.length;i+=4){
    sum += 0.299*img.data[i] + 0.587*img.data[i+1] + 0.114*img.data[i+2];
  }
  tr.brightnessScore = sum / (img.data.length/4);
}
function computeQuality(tr){
  const { w, h } = tr.box;
  const vw = video.videoWidth || 1, vh = video.videoHeight || 1;
  tr.sizeScore = Math.min(1, (w*h) / (vw*vh) / 0.25);
  const b = Math.max(0, tr.blurScore || 0);
  const blurN = Math.min(1, Math.log10(b + 1) / 3);
  const br = tr.brightnessScore || 0;
  const brN = 1 - Math.min(1, Math.abs(br - 120) / 120);
  let poseN = 1;
  if (tr.poseHistory.length){
    const avg = tr.poseHistory.reduce((a,p)=>({yaw:a.yaw+Math.abs(p.yaw),pitch:a.pitch+Math.abs(p.pitch)}),{yaw:0,pitch:0});
    const n = tr.poseHistory.length;
    poseN = Math.max(0, 1 - ((avg.yaw/n)*1.6 + (avg.pitch/n)*0.8));
  }
  tr.quality = Math.round(100 * (0.30*blurN + 0.25*brN + 0.25*tr.sizeScore + 0.20*poseN));
}
function makeThumb(box){
  try {
    const size = 96;
    const c = document.createElement('canvas');
    c.width = size; c.height = size;
    const cx = c.getContext('2d');
    cx.drawImage(video, box.x, box.y, box.w, box.h, 0, 0, size, size);
    return c.toDataURL('image/jpeg', 0.7);
  } catch { return null; }
}

/* ============================================================
   Drawing
   ============================================================ */
function roundRect(c,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}
const EMOTION_EMOJI = {
  neutral:'😐', happy:'😊', sad:'😢', angry:'😠',
  fearful:'😨', disgusted:'🤢', surprised:'😲'
};
function draw(tracks){
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);
  const s = Math.max(1, W/700);
  const color = '#00e5a0';
  for (const tr of tracks){
    const bb = tr.box;
    let x = bb.x, y = bb.y, w = bb.w, h = bb.h;
    if (mirror) x = W - x - w;

    ctx.save();
    ctx.fillStyle = color + '1a';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = color + '66';
    ctx.lineWidth = 1.5 * s;
    ctx.setLineDash([7*s, 7*s]);
    ctx.strokeRect(x, y, w, h);
    ctx.setLineDash([]);

    const c = Math.min(w,h)*0.26;
    ctx.strokeStyle = color;
    ctx.lineWidth = 4*s;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.shadowColor = color;
    ctx.shadowBlur = 14*s;
    ctx.beginPath();
    ctx.moveTo(x, y+c);      ctx.lineTo(x, y);        ctx.lineTo(x+c, y);
    ctx.moveTo(x+w-c, y);    ctx.lineTo(x+w, y);      ctx.lineTo(x+w, y+c);
    ctx.moveTo(x+w, y+h-c);  ctx.lineTo(x+w, y+h);    ctx.lineTo(x+w-c, y+h);
    ctx.moveTo(x+c, y+h);    ctx.lineTo(x, y+h);      ctx.lineTo(x, y+h-c);
    ctx.stroke();
    ctx.restore();

    const emoji = tr.emotion ? (EMOTION_EMOJI[tr.emotion]||'') : '';
    const title = (tr.name ? tr.name : `#${tr.id}`) + `  ${emoji} ${tr.emotion||''}`.trim();
    const p = tr.personId ? getPersonById(tr.personId) : null;
    const liveAvg = p ? avgAge(p) : null;
    const sub = [
      liveAvg != null ? `age:${liveAvg}` : (tr.age != null ? `~${Math.round(tr.age)}y` : null),
      tr.gender ? `${tr.gender[0].toUpperCase()} ${(tr.genderProb*100).toFixed(0)}%` : null,
      `Q:${tr.quality}`,
      tr.blinkCount ? `blink:${tr.blinkCount}` : null
    ].filter(Boolean).join(' · ');

    const fs1 = 13*s, fs2 = 11*s;
    ctx.save();
    ctx.font = `700 ${fs1}px ui-monospace,Menlo,monospace`;
    const w1 = ctx.measureText(title).width;
    ctx.font = `600 ${fs2}px ui-monospace,Menlo,monospace`;
    const w2 = ctx.measureText(sub).width;
    const padX = 9*s, padY = 5*s;
    const bw = Math.max(w1, w2) + padX*2;
    const bh = fs1 + fs2 + padY*2 + 4*s;

    let lx = x;
    let ly = y - bh - 8*s;
    if (ly < 0) ly = y + 8*s;
    if (lx + bw > W) lx = W - bw;
    if (lx < 0) lx = 0;

    ctx.fillStyle = 'rgba(4,10,18,.85)';
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5*s;
    roundRect(ctx, lx, ly, bw, bh, 8*s);
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = color;
    ctx.textBaseline = 'top';
    ctx.font = `700 ${fs1}px ui-monospace,Menlo,monospace`;
    ctx.fillText(title, lx + padX, ly + padY);
    ctx.fillStyle = 'rgba(230,237,247,.85)';
    ctx.font = `600 ${fs2}px ui-monospace,Menlo,monospace`;
    ctx.fillText(sub, lx + padX, ly + padY + fs1 + 3*s);
    ctx.restore();
  }
}

function renderFacesPanel(tracks){
  if (!tracks.length){
    if (!facesPanel.querySelector('.empty')){
      facesPanel.innerHTML = '<div class="empty">No faces yet.</div>';
    }
    faceCardCache.clear();
    return;
  }
  const empty = facesPanel.querySelector('.empty');
  if (empty) empty.remove();

  const seen = new Set();
  for (const tr of tracks){
    seen.add(tr.id);
    let card = faceCardCache.get(tr.id);
    if (!card){
      card = createFaceCard(tr);
      facesPanel.appendChild(card);
      faceCardCache.set(tr.id, card);
    }
    updateFaceCard(card, tr);
  }
  for (const [id, card] of faceCardCache){
    if (!seen.has(id)){ card.remove(); faceCardCache.delete(id); }
  }
}

}

function updatePersonCard(card, p){
  const img = card.querySelector('.person-thumb');
  if (p.thumb && img.src !== p.thumb) img.src = p.thumb;
  card.querySelector('.person-name').textContent = p.name || 'Unknown';
  const total = totalPersonTime(p);
  const sessionCount = p.sessions.length + (currentSessions.has(p.id) ? 1 : 0);
  card.querySelector('.person-meta-1').textContent =
    `${fmtDuration(total)} · ${sessionCount} session${sessionCount===1?'':'s'}`;
  card.querySelector('.person-meta-2').textContent = `Last seen ${fmtAgo(p.lastSeen)}`;
}

function renderPeoplePanel(){
  const list = peopleCache.slice().sort((a,b) => b.lastSeen - a.lastSeen);
  if (!list.length){
    if (!peoplePanel.querySelector('.empty')){
      peoplePanel.innerHTML = '<div class="empty">No saved people yet.</div>';
    }
    personCardCache.clear();
    return;
  }
  const empty = peoplePanel.querySelector('.empty');
  if (empty) empty.remove();

  const seen = new Set();
  for (const p of list){
    seen.add(p.id);
    let card = personCardCache.get(p.id);
    if (!card){
      card = createPersonCard(p);
      peoplePanel.appendChild(card);
      personCardCache.set(p.id, card);
    }
    updatePersonCard(card, p);
  }
  for (const [id, card] of personCardCache){
    if (!seen.has(id)){ card.remove(); personCardCache.delete(id); }
  }
}

/* ============================================================
   Person modal
   ============================================================ */
let modalPersonId = null;

function openPersonModal(pid){
  modalPersonId = pid;
  modal.classList.add('show');
  renderPersonModal();
}
function closePersonModal(){
  modalPersonId = null;
  modal.classList.remove('show');
}
modal.addEventListener('click', (e) => {
  if (e.target === modal) closePersonModal();
});
modalBox.addEventListener('click', (e) => {
  if (e.target.id === 'modalClose') closePersonModal();
  if (e.target.id === 'deletePerson'){
    const p = getPersonById(modalPersonId);
    if (p && confirm(`Delete "${p.name || 'Unknown'}"?`)){
      peopleCache = peopleCache.filter(x => x.id !== p.id);
      // Clear references on active tracks
      for (const tr of tracker.tracks.values()){
        if (tr.personId === p.id){ tr.personId = null; tr.personChecked = false; }
      }
      currentSessions.delete(p.id);
      markPeopleDirty();
      personCardCache.delete(p.id);
      const c = personCardCache.get(p.id); if (c) c.remove();
      flushPeople();
      closePersonModal();
      renderPeoplePanel();
    }
  }
});

function renderPersonModal(){
  if (!modalPersonId) return;
  const p = getPersonById(modalPersonId);
  if (!p){ closePersonModal(); return; }

  const total = totalPersonTime(p);
  const liveAvg = avgAge(p);
  const active = currentSessions.has(p.id);
  const sessionCount = p.sessions.length + (active ? 1 : 0);

  const sessionsHtml = (() => {
    const items = [];
    if (active){
      const s = currentSessions.get(p.id);
      items.push(`<li class="active-session">
        <span>● ${fmtTime(s.start)} → now</span>
        <span>${fmtDuration(Date.now()-s.start)}</span>
      </li>`);
    }
    const recent = p.sessions.slice().reverse();
    for (const s of recent){
      items.push(`<li>
        <span>${fmtTime(s.start)} → ${fmtTime(s.end)}</span>
        <span>${fmtDuration(s.duration)}</span>
      </li>`);
    }
    if (!items.length) return '<li style="color:var(--muted)">No sessions yet</li>';
    return items.join('');
  })();

  modalBox.innerHTML = `
    <button class="modal-close" id="modalClose">×</button>
    <div class="modal-head">
      <img class="modal-thumb" src="${p.thumb || ''}" alt="">
      <div>
        <h2>${escapeHtml(p.name || 'Unknown')}</h2>
        <p>Total: ${fmtDuration(total)} · ${sessionCount} session${sessionCount===1?'':'s'}</p>
        <p>Last seen: ${fmtAgo(p.lastSeen)}</p>
        ${active ? '<span class="badge live">● Active</span>' : ''}
      </div>
    </div>

    <div class="modal-section">
      <h3>Live average age</h3>
      ${liveAvg != null
        ? `<div class="big-age">${liveAvg}<small>from last ${p.ages.length} samples</small></div>`
        : '<p class="modal-hint">Not enough data yet</p>'}
    </div>

    <div class="modal-section">
      <h3>Recent movement</h3>
      <canvas class="modal-graph" id="modalGraph" width="500" height="300"></canvas>
      <p class="modal-hint">Last ${p.coords.length} position${p.coords.length===1?'':'s'}</p>
    </div>

    <div class="modal-section">
      <h3>Sessions (last ${p.sessions.length})</h3>
      <ul class="session-list">${sessionsHtml}</ul>
    </div>

    <div class="modal-section">
      <button class="danger-btn" id="deletePerson">Delete person</button>
    </div>
  `;

  drawMovementGraph(p.coords);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}

function drawMovementGraph(coords){
  const cvs = document.getElementById('modalGraph');
  if (!cvs) return;
  const W = cvs.width, H = cvs.height;
  const g = cvs.getContext('2d');
  g.clearRect(0,0,W,H);

  // Background grid
  g.strokeStyle = 'rgba(255,255,255,.06)';
  g.lineWidth = 1;
  for (let i=1;i<4;i++){
    g.beginPath(); g.moveTo(W*i/4, 0); g.lineTo(W*i/4, H); g.stroke();
    g.beginPath(); g.moveTo(0, H*i/4); g.lineTo(W, H*i/4); g.stroke();
  }

  if (!coords || !coords.length){
    g.fillStyle = 'rgba(139,155,180,.9)';
    g.font = '13px system-ui';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('No movement data yet', W/2, H/2);
    return;
  }

  const pad = 24;
  const xOf = v => pad + v.x * (W - pad*2);
  const yOf = v => pad + v.y * (H - pad*2);

  // Path
  if (coords.length > 1){
    g.strokeStyle = 'rgba(0,229,160,.75)';
    g.lineWidth = 2.5;
    g.lineJoin = 'round';
    g.beginPath();
    for (let i=0;i<coords.length;i++){
      const x = xOf(coords[i]), y = yOf(coords[i]);
      if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
    }
    g.stroke();
  }

  // Dots
  for (let i=0;i<coords.length;i++){
    const x = xOf(coords[i]), y = yOf(coords[i]);
    const isLast = i === coords.length - 1;
    const r = isLast ? 7 : 4;
    g.fillStyle = isLast ? '#00e5a0' : 'rgba(0,179,255,.85)';
    g.beginPath(); g.arc(x, y, r, 0, Math.PI*2); g.fill();
    if (isLast){
      g.strokeStyle = '#fff'; g.lineWidth = 2;
      g.beginPath(); g.arc(x, y, r+3, 0, Math.PI*2); g.stroke();
    }
  }
}

/* ============================================================
   Start / Stop / Errors
   ============================================================ */
function setStatus(text, kind=''){
  statusEl.textContent = text;
  dotEl.className = 'dot ' + kind;
}
function showLoader(show, text){
  loader.classList.toggle('show', show);
  if (text) loaderText.textContent = text;
}
function showOverlay(title, msg, btnLabel, showBtn){
  overlayTitle.textContent = title;
  overlayMsg.textContent = msg;
  btnEnable.textContent = btnLabel;
  btnEnable.style.display = showBtn ? '' : 'none';
  startOverlay.classList.remove('hidden');
}
function hideOverlay(){ startOverlay.classList.add('hidden'); }
function showPermissionError(msg){
  permError.textContent = msg;
  permError.style.display = msg ? 'block' : 'none';
}
function setControlsEnabled(enabled){
  btnStart.disabled = !enabled;
  btnFlip.disabled  = !enabled;
  btnMirror.disabled= !enabled;
  btnReset.disabled = !enabled;
}

async function start(){
  if (running) return;
  try {
    btnEnable.disabled = true;
    showPermissionError('');
    setStatus('Loading…', 'loading');
    await loadModels();
    await startCamera();

    running = true;
    lastDetectAt = 0;
    lastFrameTs = 0;
    fpsSmooth = 0;
    frameCounter = 0;

    hideOverlay();
    setControlsEnabled(true);
    setStatus('Live', 'live');
    btnStart.textContent = '⏹ Stop';
    btnStart.classList.remove('primary');
    btnEnable.disabled = false;
    detectLoop();
  } catch (err){
    console.error(err);
    showLoader(false);
    btnEnable.disabled = false;
    setStatus('Error', 'error');
    setControlsEnabled(false);
    let msg = 'Could not start. ' + (err.message || '');
    if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError'){
      msg = 'Camera permission denied.';
    } else if (err.name === 'NotFoundError'){
      msg = 'No camera found.';
    } else if (err.name === 'NotReadableError'){
      msg = 'Camera in use by another app.';
    } else if (!window.isSecureContext){
      msg = 'Camera requires HTTPS or localhost.';
    }
    showOverlay('Camera needed', msg, '🔄 Retry', true);
    showPermissionError(msg);
  }
}

function stop(){
  running = false;
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.srcObject = null;
  videoReady = false;
  // Close any open sessions
  const now = Date.now();
  for (const [pid, s] of currentSessions){
    s.last = Math.min(s.last, now);
    finalizeSession(pid, s);
  }
  currentSessions.clear();
  flushPeople();

  ctx.clearRect(0,0,canvas.width,canvas.height);
  faceCountEl.textContent = '0';
  fpsEl.textContent = '--';
  setStatus('Stopped', '');
  btnStart.textContent = '▶ Start';
  btnStart.classList.add('primary');
  showOverlay('Camera needed', 'Click to start.', '📷 Start', true);
  btnEnable.disabled = false;
  facesPanel.innerHTML = '<div class="empty">No faces yet.</div>';
  faceCardCache.clear();
}

/* ============================================================
   UI events
   ============================================================ */
btnEnable.addEventListener('click', start);
btnStart.addEventListener('click', () => running ? stop() : start());

btnMirror.addEventListener('click', () => {
  mirror = !mirror;
  btnMirror.classList.toggle('active', mirror);
  applyMirror();
});

btnFlip.addEventListener('click', async () => {
  facing = facing === 'user' ? 'environment' : 'user';
  if (!running) return;
  if (stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; }
  video.srcObject = null;
  try {
    await startCamera();
    lastDetectAt = 0;
  } catch (e){
    showPermissionError('Could not switch camera: ' + e.message);
  }
});

btnReset.addEventListener('click', () => {
  // Close current sessions cleanly
  const now = Date.now();
  for (const [pid, s] of currentSessions){
    s.last = Math.min(s.last, now);
    finalizeSession(pid, s);
  }
  currentSessions.clear();
  flushPeople();
  tracker.reset();
  faceCardCache.clear();
  facesPanel.innerHTML = '<div class="empty">Reset.</div>';
  renderPeoplePanel();
});

confRange.addEventListener('input', e => {
  confidence = parseFloat(e.target.value);
  confVal.textContent = confidence.toFixed(2);
  if (options) options = new faceapi.TinyFaceDetectorOptions({
    inputSize: 320, scoreThreshold: confidence
  });
});

/* ============================================================
   Periodic UI refresh
   ============================================================ */
setInterval(() => {
  renderPeoplePanel();
  if (modalPersonId) renderPersonModal();
}, 1000);

/* ============================================================
   Public API
   ============================================================ */
window.FaceAI = {
  start, stop,
  isRunning: () => running,
  onDetect(cb){ listeners.push(cb); return () => { listeners = listeners.filter(f=>f!==cb); }; },
  getDetections: () => lastDetections,
  getTracks: () => Array.from(tracker.tracks.values()),
  getPeople: () => peopleCache,
  resetTracks: () => {
    for (const [pid, s] of currentSessions){ finalizeSession(pid, s); }
    currentSessions.clear();
    tracker.reset();
    faceCardCache.clear();
    renderPeoplePanel();
  },
  setConfidence(v){
    confidence = Math.min(0.9, Math.max(0.15, v));
    confRange.value = confidence;
    confVal.textContent = confidence.toFixed(2);
    if (options) options = new faceapi.TinyFaceDetectorOptions({
      inputSize: 320, scoreThreshold: confidence
    });
  },
  setMirror(v){ mirror = !!v; btnMirror.classList.toggle('active', mirror); applyMirror(); },
  get video(){ return video; },
  get tracker(){ return tracker; }
};

window.addEventListener('beforeunload', () => {
  flushPeople();
  if (stream) stream.getTracks().forEach(t => t.stop());
});

(async function bootstrap(){
  renderPeoplePanel();
  if (!window.isSecureContext){
    showOverlay('Insecure context', 'Camera requires HTTPS or localhost.', 'Unavailable', false);
    setStatus('Insecure', 'error');
    return;
  }
  try { await start(); } catch (e){ console.error(e); }
})();
</script>
